<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <!-- ① 基本設定 -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>P2P Chat · 即時聊天室</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💬%3C/text%3E%3C/svg%3E">
  <script>
    /* 主題初始化：在樣式套用前決定深淺色，避免畫面閃爍（偏好存於 localStorage: chat_theme） */
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('chat_theme'); } catch (e) { /* 無法存取時改跟隨系統 */ }
      var dark = saved ? saved === 'dark' : !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) document.documentElement.classList.add('dark');
    })();
  </script>

  <!-- ② Tailwind CSS（CDN）＋ 主題設定 -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @custom-variant dark (&:where(.dark, .dark *));
    @theme {
      --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }
  </style>

  <!-- ③ 自訂樣式（原 style.css）：捲軸、氣泡進場動畫、打字跳動點，以及動態產生元件的樣式 -->
  <style>
    :root {
      color-scheme: light;
      --muted: #64748b;
      --name-fg: #334155;
      --mine-bg: #4f46e5;
      --mine-fg: #ffffff;
      --other-bg: #ffffff;
      --other-fg: #0f172a;
      --other-border: #e2e8f0;
      --pill-bg: #e2e8f0;
      --pill-fg: #475569;
      --locked-bg: #fef2f2;
      --locked-fg: #b91c1c;
      --locked-border: #fca5a5;
      --hover-bg: #f1f5f9;
      --scroll-thumb: #cbd5e1;
      --toast-bg: #0f172a;
      --toast-fg: #f8fafc;
    }
    :root.dark {
      color-scheme: dark;
      --muted: #94a3b8;
      --name-fg: #cbd5e1;
      --mine-bg: #6366f1;
      --other-bg: #1e293b;
      --other-fg: #e2e8f0;
      --other-border: #334155;
      --pill-bg: #1e293b;
      --pill-fg: #94a3b8;
      --locked-bg: rgba(127, 29, 29, .28);
      --locked-fg: #fca5a5;
      --locked-border: rgba(248, 113, 113, .45);
      --hover-bg: #1e293b;
      --scroll-thumb: #334155;
      --toast-bg: #f1f5f9;
      --toast-fg: #0f172a;
    }
    [hidden] { display: none !important; }
    button:not(:disabled) { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .55; }

    /* 捲軸美化 */
    .scroll-thin { scrollbar-width: thin; scrollbar-color: var(--scroll-thumb) transparent; }
    .scroll-thin::-webkit-scrollbar { width: 8px; height: 8px; }
    .scroll-thin::-webkit-scrollbar-track { background: transparent; }
    .scroll-thin::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 999px; }

    /* 連線狀態呼吸燈：連線中黃燈 / 已連線綠燈 / 斷線紅燈 */
    .status-dot { display: inline-block; flex: none; width: 10px; height: 10px; border-radius: 999px; background: #f59e0b; animation: breathe 1.8s ease-in-out infinite; }
    .status-dot[data-state="online"] { background: #10b981; }
    .status-dot[data-state="offline"], .status-dot[data-state="error"] { background: #f43f5e; }
    @keyframes breathe { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .45; transform: scale(.8); } }

    /* E2EE 狀態 */
    #btnLock[data-locked="true"] { background: rgba(16, 185, 129, .14); color: #047857; }
    :root.dark #btnLock[data-locked="true"] { color: #34d399; }

    /* 對話氣泡：自己靠右、他人靠左 */
    .msg-row { display: flex; flex-direction: column; width: 100%; }
    .msg-row.mine { align-items: flex-end; }
    .msg-row.other { align-items: flex-start; }
    .msg-meta { display: flex; align-items: baseline; gap: 6px; max-width: 85%; margin: 0 6px 4px; font-size: 12px; color: var(--muted); }
    .msg-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; color: var(--name-fg); }
    .msg-time { flex: none; font-size: 11px; }
    .msg-foot { margin: 3px 8px 0; font-size: 11px; color: var(--muted); }
    .bubble { max-width: min(80%, 36rem); padding: 8px 13px; border-radius: 18px; font-size: 15px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
    .mine .bubble { background: var(--mine-bg); color: var(--mine-fg); border-bottom-right-radius: 6px; }
    .other .bubble { background: var(--other-bg); color: var(--other-fg); border: 1px solid var(--other-border); border-bottom-left-radius: 6px; }
    .other .bubble.locked { background: var(--locked-bg); color: var(--locked-fg); border: 1px dashed var(--locked-border); font-size: 13px; cursor: pointer; }
    .bubble.image { padding: 4px; line-height: 0; }
    .bubble.image img { display: block; max-width: min(240px, 60vw); max-height: 320px; border-radius: 14px; cursor: zoom-in; }
    .bubble-in { animation: bubble-in .22s ease-out both; }
    @keyframes bubble-in { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }

    /* 系統通知：置中膠囊標籤 */
    .sys-pill { align-self: center; max-width: 90%; padding: 4px 12px; border-radius: 999px; background: var(--pill-bg); color: var(--pill-fg); font-size: 12px; text-align: center; overflow-wrap: anywhere; }
    .sys-pill.success { background: rgba(16, 185, 129, .14); color: #047857; }
    .sys-pill.warn { background: rgba(245, 158, 11, .16); color: #b45309; }
    .sys-pill.error { background: rgba(244, 63, 94, .14); color: #be123c; }
    :root.dark .sys-pill.success { color: #34d399; }
    :root.dark .sys-pill.warn { color: #fbbf24; }
    :root.dark .sys-pill.error { color: #fb7185; }

    /* 打字跳動點 */
    .typing-dots { display: inline-flex; gap: 3px; margin-right: 6px; }
    .typing-dots span { width: 5px; height: 5px; border-radius: 999px; background: currentColor; animation: typing-bounce 1.2s ease-in-out infinite; }
    .typing-dots span:nth-child(2) { animation-delay: .15s; }
    .typing-dots span:nth-child(3) { animation-delay: .3s; }
    @keyframes typing-bounce { 0%, 80%, 100% { transform: translateY(0); opacity: .35; } 40% { transform: translateY(-4px); opacity: 1; } }

    /* 在線名單 */
    .member { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 10px; }
    .member:hover { background: var(--hover-bg); }
    .avatar { display: grid; place-items: center; flex: none; width: 30px; height: 30px; border-radius: 999px; color: #fff; font-size: 13px; font-weight: 700; }
    .member-name { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
    .member-tag { flex: none; padding: 1px 7px; border-radius: 999px; background: rgba(99, 102, 241, .15); color: #6366f1; font-size: 11px; }

    /* Toast 提示 */
    .toast { padding: 9px 16px; border-radius: 12px; background: var(--toast-bg); color: var(--toast-fg); font-size: 14px; box-shadow: 0 10px 30px -12px rgba(0, 0, 0, .45); animation: toast-in .2s ease-out both; }
    .toast.error { background: #e11d48; color: #fff; }
    .toast.leaving { animation: toast-out .2s ease-in both; }
    @keyframes toast-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @keyframes toast-out { to { opacity: 0; transform: translateY(10px); } }

    @media (prefers-reduced-motion: reduce) {
      .bubble-in, .toast, .toast.leaving, .status-dot, .typing-dots span { animation: none !important; }
    }
  </style>
</head>
<body class="h-dvh overflow-hidden bg-slate-100 font-sans text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100">
  <!-- ④ 頁面結構 -->
  <div id="app" class="flex h-dvh flex-col">

    <!-- Header：Logo、房號、連線狀態、E2EE、分享、深淺色、修改暱稱 -->
    <header class="z-20 flex shrink-0 items-center gap-2 border-b border-slate-200 bg-white/85 px-3 py-2 backdrop-blur-md dark:border-slate-800 dark:bg-slate-900/85 sm:px-4">
      <div class="flex min-w-0 items-center gap-2">
        <span class="text-2xl leading-none" aria-hidden="true">💬</span>
        <span class="hidden text-base font-bold tracking-tight sm:inline">P2P Chat</span>
        <span id="roomBadge" class="max-w-[38vw] truncate rounded-full bg-indigo-50 px-2.5 py-1 font-mono text-sm font-medium text-indigo-700 dark:bg-indigo-500/15 dark:text-indigo-300 sm:max-w-64">#lobby</span>
        <span id="connWrap" class="flex items-center gap-1.5 text-xs text-slate-500 dark:text-slate-400" title="連線狀態">
          <span id="connDot" class="status-dot" data-state="connecting"></span>
          <span id="connText" class="hidden whitespace-nowrap md:inline">連線中…</span>
        </span>
      </div>
      <nav class="ml-auto flex items-center gap-0.5 sm:gap-1" aria-label="功能">
        <button id="btnLock" type="button" class="inline-flex h-9 items-center gap-1 rounded-lg px-2 text-base hover:bg-slate-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500/50 dark:hover:bg-slate-800" title="房間密碼（選填）" aria-label="房間密碼">
          <span id="lockIcon" aria-hidden="true">🔓</span><span id="lockText" class="hidden text-xs font-medium lg:inline">未加密</span>
        </button>
        <button id="btnShare" type="button" class="inline-flex h-9 items-center gap-1 rounded-lg px-2 text-base hover:bg-slate-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500/50 dark:hover:bg-slate-800" title="分享房間" aria-label="分享房間">
          <span aria-hidden="true">🔗</span><span class="hidden text-xs font-medium lg:inline">分享</span>
        </button>
        <button id="btnTheme" type="button" class="inline-flex h-9 items-center gap-1 rounded-lg px-2 text-base hover:bg-slate-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500/50 dark:hover:bg-slate-800" title="切換深淺色" aria-label="切換深淺色">
          <span id="themeIcon" aria-hidden="true">🌙</span>
        </button>
        <button id="btnNick" type="button" class="inline-flex h-9 items-center gap-1 rounded-lg px-2 text-base hover:bg-slate-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500/50 dark:hover:bg-slate-800" title="修改基礎暱稱" aria-label="修改基礎暱稱">
          <span aria-hidden="true">✏️</span><span id="nickText" class="hidden max-w-48 truncate font-mono text-xs xl:inline"></span>
        </button>
        <button id="btnMembers" type="button" class="inline-flex h-9 items-center gap-1 rounded-lg px-2 text-base hover:bg-slate-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500/50 dark:hover:bg-slate-800 lg:hidden" title="在線名單" aria-label="在線名單">
          <span aria-hidden="true">👥</span><span id="memberCountBadge" class="text-xs font-semibold">1</span>
        </button>
      </nav>
    </header>

    <div class="flex min-h-0 flex-1">
      <!-- Main：中央對話區 -->
      <main class="relative flex min-w-0 flex-1 flex-col">
        <div id="messages" class="scroll-thin flex flex-1 flex-col gap-3 overflow-y-auto px-3 py-4 sm:px-6" aria-live="polite"></div>
        <button id="newMsgPill" type="button" class="absolute bottom-28 left-1/2 -translate-x-1/2 rounded-full bg-indigo-600 px-3 py-1.5 text-xs font-medium text-white shadow-lg hover:bg-indigo-500" hidden>有新訊息 ↓</button>

        <!-- 正在輸入中提示（輸入框上方） -->
        <div class="flex h-6 shrink-0 items-center px-4 text-xs text-slate-500 dark:text-slate-400 sm:px-6" aria-live="polite">
          <span id="typingInner" class="flex min-w-0 items-center" hidden>
            <span class="typing-dots" aria-hidden="true"><span></span><span></span><span></span></span>
            <span id="typingText" class="truncate"></span>
          </span>
        </div>

        <!-- 底部輸入列 -->
        <form id="composer" class="flex shrink-0 items-end gap-2 border-t border-slate-200 bg-white px-2 py-2 dark:border-slate-800 dark:bg-slate-900 sm:px-4 sm:py-3" autocomplete="off">
          <button id="btnImage" type="button" class="inline-flex size-10 shrink-0 items-center justify-center rounded-xl text-xl hover:bg-slate-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500/50 dark:hover:bg-slate-800" title="上傳圖片（也可直接貼上截圖）" aria-label="上傳圖片">🖼️</button>
          <input id="fileInput" type="file" accept="image/*" hidden>
          <textarea id="msgInput" rows="1" maxlength="2000" placeholder="輸入訊息…（Enter 送出、Shift+Enter 換行，可直接貼上截圖）" class="scroll-thin max-h-40 min-h-10 min-w-0 flex-1 resize-none rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-[15px] leading-6 placeholder:text-slate-400 focus:border-indigo-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/30 dark:border-slate-700 dark:bg-slate-800 dark:placeholder:text-slate-500" aria-label="訊息"></textarea>
          <button id="btnSend" type="submit" class="inline-flex h-10 shrink-0 items-center rounded-xl bg-indigo-600 px-4 text-sm font-semibold text-white hover:bg-indigo-500 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500/50">送出</button>
        </form>
      </main>

      <!-- Sidebar：房間切換與在線名單（手機版為滑出式抽屜） -->
      <div id="drawerOverlay" class="fixed inset-0 z-30 bg-slate-950/40 lg:hidden" hidden></div>
      <aside id="sidebar" class="fixed inset-y-0 right-0 z-40 flex w-80 max-w-[85vw] translate-x-full flex-col border-l border-slate-200 bg-white transition-transform duration-200 dark:border-slate-800 dark:bg-slate-900 lg:static lg:z-auto lg:w-72 lg:translate-x-0" aria-label="房間與在線名單">
        <div class="flex items-center justify-between border-b border-slate-200 px-4 py-3 dark:border-slate-800 lg:hidden">
          <span class="font-semibold">房間資訊</span>
          <button id="btnCloseDrawer" type="button" class="rounded-lg px-2 py-1 text-slate-500 hover:bg-slate-100 dark:text-slate-400 dark:hover:bg-slate-800" aria-label="關閉">✕</button>
        </div>

        <section class="space-y-2 border-b border-slate-200 px-4 py-4 dark:border-slate-800">
          <h2 class="text-xs font-semibold tracking-wide text-slate-500 dark:text-slate-400">切換房間</h2>
          <form id="roomForm" class="flex gap-2" autocomplete="off">
            <input id="roomInput" type="text" maxlength="48" placeholder="✏️ 自訂房間名稱" class="min-w-0 flex-1 rounded-lg border border-slate-200 bg-slate-50 px-3 py-2 text-sm focus:border-indigo-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/30 dark:border-slate-700 dark:bg-slate-800" aria-label="自訂房間名稱">
            <button type="submit" class="shrink-0 rounded-lg bg-slate-900 px-3 text-sm font-medium text-white hover:bg-slate-700 dark:bg-slate-100 dark:text-slate-900 dark:hover:bg-white">前往</button>
          </form>
          <button id="btnRandomRoom" type="button" class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm font-medium hover:bg-slate-50 dark:border-slate-700 dark:hover:bg-slate-800">🎲 隨機新房間</button>
        </section>

        <section class="flex min-h-0 flex-1 flex-col px-2 py-3">
          <h2 class="px-2 pb-2 text-xs font-semibold tracking-wide text-slate-500 dark:text-slate-400">在線成員（<span id="memberCount">1</span>）</h2>
          <ul id="memberList" class="scroll-thin min-h-0 flex-1 space-y-0.5 overflow-y-auto"></ul>
        </section>

        <div class="border-t border-slate-200 px-4 py-3 text-xs leading-5 text-slate-500 dark:border-slate-800 dark:text-slate-400">
          <div class="truncate">中繼節點：<span id="brokerText" class="font-mono">—</span></div>
          <div>訊息不留存，關閉分頁即消失。</div>
        </div>
      </aside>
    </div>
  </div>

  <!-- Modal：設定 / 修改基礎暱稱 -->
  <div id="nickModal" data-modal data-closable="false" class="fixed inset-0 z-50 grid place-items-center bg-slate-950/50 p-4 backdrop-blur-sm" hidden>
    <form id="nickForm" class="w-full max-w-sm rounded-2xl bg-white p-6 shadow-2xl ring-1 ring-slate-200 dark:bg-slate-900 dark:ring-slate-800" autocomplete="off" novalidate role="dialog" aria-modal="true" aria-labelledby="nickTitle">
      <h2 id="nickTitle" class="text-lg font-bold">歡迎！先取個暱稱</h2>
      <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">系統會自動加上當日日期與識別碼，例如 <span class="font-mono">Alex-20261019#8f3a</span>。</p>
      <input id="nickInput" type="text" maxlength="32" placeholder="基礎暱稱（1～16 字）" class="mt-4 w-full rounded-lg border border-slate-200 bg-slate-50 px-3 py-2 focus:border-indigo-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/30 dark:border-slate-700 dark:bg-slate-800" aria-label="基礎暱稱" aria-describedby="nickError">
      <p id="nickError" class="mt-2 min-h-5 text-sm text-rose-600 dark:text-rose-400" aria-live="polite"></p>
      <div class="mt-2 flex justify-end gap-2">
        <button id="nickCancel" type="button" class="rounded-lg px-4 py-2 text-sm hover:bg-slate-100 dark:hover:bg-slate-800">取消</button>
        <button type="submit" class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-500">確定</button>
      </div>
    </form>
  </div>

  <!-- Modal：分享房間（網址 + QR Code） -->
  <div id="shareModal" data-modal data-closable="true" class="fixed inset-0 z-50 grid place-items-center bg-slate-950/50 p-4 backdrop-blur-sm" hidden>
    <div class="w-full max-w-sm rounded-2xl bg-white p-6 shadow-2xl ring-1 ring-slate-200 dark:bg-slate-900 dark:ring-slate-800" role="dialog" aria-modal="true" aria-labelledby="shareTitle">
      <div class="flex items-center justify-between">
        <h2 id="shareTitle" class="text-lg font-bold">🔗 分享房間</h2>
        <button type="button" data-close class="rounded-lg px-2 py-1 text-slate-500 hover:bg-slate-100 dark:text-slate-400 dark:hover:bg-slate-800" aria-label="關閉">✕</button>
      </div>
      <div class="mt-4 flex gap-2">
        <input id="shareUrl" type="text" readonly class="min-w-0 flex-1 rounded-lg border border-slate-200 bg-slate-50 px-3 py-2 font-mono text-xs dark:border-slate-700 dark:bg-slate-800" aria-label="房間網址">
        <button id="btnCopy" type="button" class="shrink-0 rounded-lg bg-indigo-600 px-3 text-sm font-semibold text-white hover:bg-indigo-500">複製</button>
      </div>
      <div id="qrWrap" class="mx-auto mt-5 w-fit rounded-xl bg-white p-3 ring-1 ring-slate-200 dark:ring-slate-700">
        <div id="qrBox"></div>
      </div>
      <p id="qrNote" class="mt-3 text-center text-xs text-slate-500 dark:text-slate-400"></p>
    </div>
  </div>

  <!-- Modal：房間密碼（E2EE） -->
  <div id="lockModal" data-modal data-closable="true" class="fixed inset-0 z-50 grid place-items-center bg-slate-950/50 p-4 backdrop-blur-sm" hidden>
    <form id="lockForm" class="w-full max-w-sm rounded-2xl bg-white p-6 shadow-2xl ring-1 ring-slate-200 dark:bg-slate-900 dark:ring-slate-800" autocomplete="off" role="dialog" aria-modal="true" aria-labelledby="lockTitle">
      <div class="flex items-center justify-between">
        <h2 id="lockTitle" class="text-lg font-bold">🔒 房間密碼（選填）</h2>
        <button type="button" data-close class="rounded-lg px-2 py-1 text-slate-500 hover:bg-slate-100 dark:text-slate-400 dark:hover:bg-slate-800" aria-label="關閉">✕</button>
      </div>
      <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">設定後，文字與圖片會先在瀏覽器以 AES-GCM 加密再送出，只有輸入相同密碼的成員能解讀。密碼只留在這個分頁，不會傳送或儲存。</p>
      <p id="lockState" class="mt-3 text-sm font-medium">目前狀態：🔓 未加密（明文傳送）</p>
      <input id="lockInput" type="password" autocomplete="new-password" placeholder="輸入房間密碼" class="mt-3 w-full rounded-lg border border-slate-200 bg-slate-50 px-3 py-2 focus:border-indigo-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/30 dark:border-slate-700 dark:bg-slate-800" aria-label="房間密碼">
      <div class="mt-4 flex justify-end gap-2">
        <button id="btnUnlockClear" type="button" class="rounded-lg px-4 py-2 text-sm text-rose-600 hover:bg-rose-50 dark:text-rose-400 dark:hover:bg-rose-500/10">移除密碼</button>
        <button id="btnLockApply" type="submit" class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-500">套用</button>
      </div>
    </form>
  </div>

  <!-- Modal：圖片放大檢視 -->
  <div id="imgModal" data-modal data-closable="true" class="fixed inset-0 z-50 grid cursor-zoom-out place-items-center bg-slate-950/85 p-4" hidden>
    <img id="imgModalImg" alt="放大檢視的圖片" class="max-h-[90vh] max-w-[95vw] rounded-xl shadow-2xl">
  </div>

  <!-- 環境不支援時的全頁提示 -->
  <div id="fatal" class="fixed inset-0 z-[60] grid place-items-center bg-slate-100 p-6 text-center dark:bg-slate-950" hidden>
    <div class="max-w-md">
      <div class="text-5xl" aria-hidden="true">⚠️</div>
      <h1 id="fatalTitle" class="mt-4 text-xl font-bold"></h1>
      <p id="fatalMsg" class="mt-2 text-sm leading-6 text-slate-600 dark:text-slate-400"></p>
    </div>
  </div>

  <!-- Toast 容器 -->
  <div id="toasts" class="pointer-events-none fixed inset-x-0 bottom-24 z-[70] flex flex-col items-center gap-2 px-4" aria-live="assertive"></div>

  <!-- ⑤ 第三方函式庫（CDN） -->
  <script src="https://unpkg.com/mqtt@5/dist/mqtt.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <!-- ⑥ 主程式（原 app.js） -->
  <script>
    (() => {
      'use strict';

      // ===== CONFIG =====
      // 所有可調參數集中於此（數值來源：規格書第 1～3 章與 6.4）
      const CONFIG = Object.freeze({
        BROKERS: ['wss://broker.emqx.io:8084/mqtt', 'wss://test.mosquitto.org:8081'],
        TOPIC_PREFIX: 'gh-p2p-ws-chat-v2',
        DEFAULT_ROOM: 'lobby',
        COOKIE_MAX_AGE: 2592000,     // 30 天
        NAME_MAX_LEN: 16,
        UUID_LEN: 4,                 // 可改為 6
        HEARTBEAT_MS: 10000,
        SWEEP_MS: 5000,
        PEER_TIMEOUT_MS: 25000,
        TYPING_THROTTLE_MS: 1500,
        TYPING_HIDE_MS: 3000,
        PBKDF2_ITERATIONS: 100000,
        IMG_MAX_EDGE: 800,
        IMG_QUALITY: 0.7,
        IMG_TARGET_BYTES: 102400,    // 100KB
        // ── 以下為實作輔助參數（規格未規定） ──
        RECONNECT_BASE_MS: 1000,
        RECONNECT_MAX_MS: 30000,
        MAX_TEXT_LEN: 2000,
        MAX_PACKET_CHARS: 400000,
        MAX_RENDERED: 300,
        MAX_PEERS: 500,
      });

      // ===== Utils =====
      const $ = (id) => document.getElementById(id);
      const TYPES = new Set(['chat', 'image', 'join', 'leave', 'heartbeat', 'typing']);
      const IMAGE_RE = /^data:image\/(jpeg|png|webp|gif);base64,[A-Za-z0-9+/]+={0,2}$/;

      // 建立元素；文字一律以 textContent 寫入，杜絕 XSS
      function el(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text != null) node.textContent = text;
        return node;
      }
      // HTML Entity Escape：保留給必須組 HTML 字串的情境（本程式寫入 DOM 一律使用 textContent）
      function escapeHTML(str) {
        return String(str).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
      }
      function randomInt(max) { return crypto.getRandomValues(new Uint32Array(1))[0] % max; }
      function randomHex(bytes) {
        return Array.from(crypto.getRandomValues(new Uint8Array(bytes)), (b) => b.toString(16).padStart(2, '0')).join('');
      }
      function randomBase36(len) { let s = ''; while (s.length < len) s += randomInt(36).toString(36); return s; }
      function newMsgId() { return `msg-${Date.now()}-${randomBase36(4)}`; }
      const pad2 = (n) => String(n).padStart(2, '0');
      function todayStr(d = new Date()) { return `${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}`; }
      function timeStr(ts) { const d = new Date(ts); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }
      function charLen(str) { return Array.from(str).length; }
      function hueFrom(str) { let h = 0; for (const ch of str) h = (h * 31 + ch.codePointAt(0)) >>> 0; return h % 360; }
      async function sha256Hex(text) {
        const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
        return Array.from(new Uint8Array(buf), (b) => b.toString(16).padStart(2, '0')).join('');
      }
      function bytesToB64(bytes) {
        let bin = '';
        for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
        return btoa(bin);
      }
      function b64ToBytes(b64) {
        const bin = atob(b64);
        const out = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
        return out;
      }
      function toast(text, tone = 'info') {
        const node = el('div', 'toast' + (tone === 'error' ? ' error' : ''), text);
        $('toasts').appendChild(node);
        setTimeout(() => { node.classList.add('leaving'); setTimeout(() => node.remove(), 220); }, 2400);
      }
      function autoGrow() {
        const t = $('msgInput');
        t.style.height = 'auto';
        t.style.height = Math.min(t.scrollHeight, 160) + 'px';
      }

      // ===== Identity =====
      const Cookie = {
        get(name) {
          const hit = document.cookie.split('; ').find((part) => part.startsWith(name + '='));
          if (!hit) return null;
          try { return decodeURIComponent(hit.slice(name.length + 1)); } catch { return null; }
        },
        set(name, value) {
          document.cookie = `${name}=${encodeURIComponent(value)}; max-age=${CONFIG.COOKIE_MAX_AGE}; SameSite=Lax; path=/`;
        },
      };

      // 2.1 儲存備援：Cookie 優先 → localStorage → 僅限本分頁記憶體
      const memoryStore = new Map();
      const Store = {
        read(key) {
          const fromCookie = Cookie.get(key);
          if (fromCookie) return fromCookie;
          try { const v = localStorage.getItem(key); if (v) return v; } catch { /* localStorage 不可用 */ }
          return memoryStore.get(key) || null;
        },
        write(key, value) {
          try { Cookie.set(key, value); } catch { /* 忽略 */ }
          if (Cookie.get(key) === value) return 'cookie';   // 寫入後回讀驗證
          try { localStorage.setItem(key, value); return 'localStorage'; } catch { /* 忽略 */ }
          memoryStore.set(key, value);
          return 'memory';
        },
      };

      function validateNick(raw) {
        const name = String(raw ?? '').trim();
        if (!name) return '暱稱不可為空白';
        if (charLen(name) > CONFIG.NAME_MAX_LEN) return `暱稱最多 ${CONFIG.NAME_MAX_LEN} 個字`;
        if (/[\u0000-\u001f\u007f]/.test(name)) return '暱稱含有不允許的字元';
        return '';
      }

      const Identity = {
        baseName: '', seed: '', date: '', uid: '', displayName: '', storage: '',
        // 讀取既有身分；成功時重寫一次以延長 30 天效期
        async load() {
          const name = Store.read('chat_base_name');
          const seed = Store.read('chat_seed');
          if (!name || !seed || validateNick(name)) return false;
          this.seed = seed;
          await this.save(name.trim());
          return true;
        },
        async save(name) {
          if (!this.seed) this.seed = randomHex(16);   // 高熵設備亂數種子
          this.storage = Store.write('chat_seed', this.seed);
          Store.write('chat_base_name', name);
          await this.apply(name);
        },
        // 名稱-YYYYMMDD#UUID；UUID = SHA-256("名稱-日期-seed") 前 N 碼小寫 Hex
        async apply(name) {
          const date = todayStr();
          const hex = await sha256Hex(`${name}-${date}-${this.seed}`);
          this.baseName = name;
          this.date = date;
          this.uid = hex.slice(0, CONFIG.UUID_LEN);
          this.displayName = `${name}-${date}#${this.uid}`;
        },
        sender() { return { uid: this.uid, baseName: this.baseName, displayName: this.displayName }; },
      };

      // ===== Router =====
      const ROOM_WORDS_A = ['amber', 'brave', 'calm', 'cosmic', 'crisp', 'dawn', 'fuzzy', 'golden', 'happy', 'jolly', 'lucky', 'misty', 'neon', 'quiet', 'rapid', 'silver', 'sunny', 'swift', 'witty', 'zen'];
      const ROOM_WORDS_B = ['otter', 'panda', 'falcon', 'maple', 'comet', 'river', 'tiger', 'koala', 'lotus', 'pixel', 'raven', 'cedar', 'ember', 'harbor', 'meadow', 'nova', 'orbit', 'pebble', 'willow', 'zephyr'];

      const Router = {
        room: CONFIG.DEFAULT_ROOM,
        decode(raw) { try { return decodeURIComponent(raw); } catch { return raw; } },
        // 房號正規化：小寫、僅保留文字 / 數字 / 底線 / 連字號，最長 48 字；空值導向預設大廳
        normalize(raw) {
          let r = this.decode(String(raw ?? '')).replace(/^#+/, '').normalize('NFC').trim().toLowerCase();
          r = r.replace(/[^\p{L}\p{M}\p{N}_-]+/gu, '-').replace(/-{2,}/g, '-');
          r = Array.from(r).slice(0, 48).join('').replace(/^-+|-+$/g, '');
          return r || CONFIG.DEFAULT_ROOM;
        },
        // 讀取目前 Hash；空白或不合規時改寫網址（不新增瀏覽紀錄）
        readHash() {
          const raw = location.hash.slice(1);
          const room = this.normalize(raw);
          if (this.decode(raw) !== room) {
            try { history.replaceState(null, '', '#' + room); } catch { location.replace('#' + room); }
          }
          return room;
        },
        go(raw) { location.hash = '#' + this.normalize(raw); },   // 實際切換交給 hashchange
        randomRoom() {
          const a = ROOM_WORDS_A[randomInt(ROOM_WORDS_A.length)];
          const b = ROOM_WORDS_B[randomInt(ROOM_WORDS_B.length)];
          return `${a}-${b}-${10 + randomInt(90)}`;
        },
      };

      // ===== CryptoBox =====（命名避開全域 crypto）
      const CryptoBox = {
        key: null,
        // PBKDF2(房間密碼, salt = 房間名稱, 100,000 次, SHA-256) → AES-GCM 256-bit
        async derive(password, room) {
          const enc = new TextEncoder();
          const base = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
          return crypto.subtle.deriveKey(
            { name: 'PBKDF2', salt: enc.encode(room), iterations: CONFIG.PBKDF2_ITERATIONS, hash: 'SHA-256' },
            base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt'],
          );
        },
        // 每則訊息產生 12-byte 隨機 IV，輸出 Base64 密文
        async encrypt(plain) {
          const iv = crypto.getRandomValues(new Uint8Array(12));
          const cipher = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, this.key, new TextEncoder().encode(plain));
          return { iv: bytesToB64(iv), payload: bytesToB64(new Uint8Array(cipher)) };
        },
        async decrypt(payload, iv) {
          if (!this.key) throw new Error('NO_KEY');
          const ivBytes = b64ToBytes(iv);
          if (ivBytes.length !== 12) throw new Error('BAD_IV');
          const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: ivBytes }, this.key, b64ToBytes(payload));
          return new TextDecoder().decode(plain);
        },
      };

      // ===== Transport =====
      const Transport = {
        client: null,
        brokerIndex: 0,
        attempt: 0,
        timer: null,
        watchdog: null,
        topic: '',
        connected: false,
        subscribed: false,
        everConnected: false,
        sentIds: new Map(),   // 自己送出的封包 id → 時間，用來過濾 Broker 回送的回音

        get host() { try { return new URL(CONFIG.BROKERS[this.brokerIndex]).host; } catch { return '—'; } },
        topicFor(room) { return `${CONFIG.TOPIC_PREFIX}/${room}/stream`; },

        connect() {
          clearTimeout(this.timer);
          this.timer = null;
          clearTimeout(this.watchdog);
          if (this.client) { const old = this.client; this.client = null; try { old.end(true); } catch { /* 忽略 */ } }
          UI.setConn('connecting', this.attempt);
          UI.setBroker(this.host);
          let client;
          try {
            client = mqtt.connect(CONFIG.BROKERS[this.brokerIndex], {
              clientId: 'ghchat_' + randomHex(6),
              clean: true,            // 不保留 Session，加入前的訊息一律不回溯
              keepalive: 30,
              connectTimeout: 8000,
              reconnectPeriod: 0,     // 重連改由下方指數退避控制，並輪替主 / 備援節點
              protocolVersion: 4,
            });
          } catch (err) {
            console.warn('[MQTT]', err);
            this.scheduleReconnect();
            return;
          }
          this.client = client;
          // 保險：逾時仍未連上就強制改走重連流程
          this.watchdog = setTimeout(() => {
            if (client === this.client && !this.connected) {
              try { client.end(true); } catch { /* 忽略 */ }
              this.scheduleReconnect();
            }
          }, 12000);
          client.on('connect', () => {
            if (client !== this.client) return;
            clearTimeout(this.watchdog);
            const isReconnect = this.everConnected;
            this.connected = true;
            this.everConnected = true;
            this.attempt = 0;
            UI.setConn('online');
            this.subscribe(Router.room, isReconnect);
          });
          client.on('message', (topic, payload) => {
            if (client === this.client && topic === this.topic) App.onRaw(payload);
          });
          client.on('close', () => {
            if (client !== this.client) return;
            const wasConnected = this.connected;
            this.connected = false;
            this.subscribed = false;
            Presence.stopHeartbeat();
            if (wasConnected) App.onDisconnected();
            this.scheduleReconnect();
          });
          client.on('error', (err) => console.warn('[MQTT]', err && err.message));
        },

        // 指數退避：1s、2s、4s…上限 30s（另加隨機抖動）；每次失敗輪替主 / 備援節點
        scheduleReconnect() {
          if (this.timer) return;
          this.attempt += 1;
          this.brokerIndex = (this.brokerIndex + 1) % CONFIG.BROKERS.length;
          const delay = Math.min(CONFIG.RECONNECT_MAX_MS, CONFIG.RECONNECT_BASE_MS * 2 ** (this.attempt - 1)) + randomInt(500);
          UI.setConn('offline', this.attempt, delay);
          this.timer = setTimeout(() => { this.timer = null; this.connect(); }, delay);
        },

        // 網路恢復時立即重試（略過等待）
        retryNow() {
          if (this.connected || !this.client) return;
          this.attempt = 0;
          this.connect();
        },

        subscribe(room, isReconnect = false) {
          const client = this.client;
          if (!client || !this.connected) return;
          const topic = this.topicFor(room);
          this.topic = topic;
          this.subscribed = false;
          client.subscribe(topic, { qos: 0 }, (err) => {
            if (client !== this.client || topic !== this.topic) return;
            if (err) { UI.system('訂閱房間失敗：' + (err.message || err), 'error'); return; }
            this.subscribed = true;
            App.onSubscribed(isReconnect);
          });
        },

        unsubscribe() {
          if (this.client && this.connected && this.topic) {
            try { this.client.unsubscribe(this.topic); } catch { /* 忽略 */ }
          }
          this.topic = '';
          this.subscribed = false;
        },

        // 所有封包皆 retain: false，Broker 不留存任何訊息
        publish(packet) {
          if (!this.client || !this.connected || !this.subscribed) return false;
          this.sentIds.set(packet.id, Date.now());
          this.client.publish(this.topic, JSON.stringify(packet), { qos: 0, retain: false });
          return true;
        },

        pruneSent() {
          const limit = Date.now() - 60000;
          for (const [id, t] of this.sentIds) if (t < limit) this.sentIds.delete(id);
        },
      };

      // ===== Presence =====
      const Presence = {
        peers: new Map(),   // displayName → { uid, baseName, displayName, lastSeen }
        timer: null,

        // 每 10 秒廣播心跳
        startHeartbeat() {
          this.stopHeartbeat();
          this.timer = setInterval(() => App.sendControl('heartbeat'), CONFIG.HEARTBEAT_MS);
        },
        stopHeartbeat() { clearInterval(this.timer); this.timer = null; },

        // 更新 lastSeen；回傳是否為新成員
        touch(sender) {
          if (sender.displayName === Identity.displayName) return false;
          const known = this.peers.get(sender.displayName);
          if (known) { known.lastSeen = Date.now(); return false; }
          if (this.peers.size >= CONFIG.MAX_PEERS) return false;
          this.peers.set(sender.displayName, {
            uid: sender.uid, baseName: sender.baseName, displayName: sender.displayName, lastSeen: Date.now(),
          });
          UI.renderMembers();
          return true;
        },
        remove(displayName) {
          if (!this.peers.delete(displayName)) return false;
          UI.renderMembers();
          return true;
        },
        // 重新連線後給舊名單一段寬限期，等對方回覆心跳
        refreshAll() {
          const now = Date.now();
          for (const peer of this.peers.values()) peer.lastSeen = now;
        },
        // 每 5 秒檢查：超過 25 秒沒收到任何封包即判定斷線（自己離線時不判定）
        sweep() {
          if (!Transport.subscribed) return;
          const now = Date.now();
          let changed = false;
          for (const [name, peer] of this.peers) {
            if (now - peer.lastSeen <= CONFIG.PEER_TIMEOUT_MS) continue;
            this.peers.delete(name);
            Typing.clear(name);
            UI.system(`${name} 已離開房間（連線逾時）`, 'warn');
            changed = true;
          }
          if (changed) UI.renderMembers();
        },
        reset() { this.peers.clear(); UI.renderMembers(); },
      };

      // ===== Typing =====
      const Typing = {
        lastSent: 0,
        timers: new Map(),   // displayName → 自動隱藏計時器

        // 節流：持續輸入時每 1.5 秒最多送出一次 typing
        onLocalInput() {
          if (!$('msgInput').value.trim()) return;
          const now = Date.now();
          if (now - this.lastSent < CONFIG.TYPING_THROTTLE_MS) return;
          if (App.sendControl('typing')) this.lastSent = now;
        },
        resetLocal() { this.lastSent = 0; },
        // 3 秒內沒有新的 typing 封包就自動隱藏
        onRemote(name) {
          clearTimeout(this.timers.get(name));
          this.timers.set(name, setTimeout(() => this.clear(name), CONFIG.TYPING_HIDE_MS));
          this.render();
        },
        clear(name) {
          if (!this.timers.has(name)) return;
          clearTimeout(this.timers.get(name));
          this.timers.delete(name);
          this.render();
        },
        clearAll() {
          for (const t of this.timers.values()) clearTimeout(t);
          this.timers.clear();
          this.render();
        },
        render() {
          const names = [...this.timers.keys()];
          $('typingInner').hidden = names.length === 0;
          if (!names.length) return;
          const shown = names.slice(0, 2).join('、');
          $('typingText').textContent = names.length > 2
            ? `${shown} 等 ${names.length} 人正在輸入中...`
            : `${shown} 正在輸入中...`;
        },
      };

      // ===== Media =====
      const Media = {
        webp: null,
        supportsWebP() {
          if (this.webp === null) {
            try {
              const c = document.createElement('canvas');
              c.width = c.height = 1;
              this.webp = c.toDataURL('image/webp').startsWith('data:image/webp');
            } catch { this.webp = false; }
          }
          return this.webp;
        },
        loadImage(file) {
          return new Promise((resolve, reject) => {
            const url = URL.createObjectURL(file);
            const img = new Image();
            img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
            img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('無法讀取這張圖片')); };
            img.src = url;
          });
        },
        bytesOf(dataUrl) { return Math.floor((dataUrl.length - dataUrl.indexOf(',') - 1) * 3 / 4); },
        // 隱藏 canvas 等比例縮放（長邊 ≤ 800px），轉 WebP / JPEG（品質 0.7 起），逐步調降直到 ≤ 100KB
        async compress(file) {
          if (!file || !/^image\//.test(file.type)) throw new Error('只支援圖片檔案');
          const img = await this.loadImage(file);
          const w0 = img.naturalWidth;
          const h0 = img.naturalHeight;
          if (!w0 || !h0) throw new Error('無法讀取這張圖片');
          const type = this.supportsWebP() ? 'image/webp' : 'image/jpeg';
          const canvas = document.createElement('canvas');   // 不加入 DOM 的隱藏 canvas
          const ctx = canvas.getContext('2d');
          let scale = Math.min(1, CONFIG.IMG_MAX_EDGE / Math.max(w0, h0));
          let quality = CONFIG.IMG_QUALITY;
          let dataUrl = '';
          for (let i = 0; i < 8; i++) {
            canvas.width = Math.max(1, Math.round(w0 * scale));
            canvas.height = Math.max(1, Math.round(h0 * scale));
            ctx.fillStyle = '#ffffff';                        // 透明背景補白，避免轉 JPEG 後變黑
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            dataUrl = canvas.toDataURL(type, quality);
            if (this.bytesOf(dataUrl) <= CONFIG.IMG_TARGET_BYTES) break;
            if (quality > 0.45) quality = Math.max(0.45, quality - 0.1);
            else scale *= 0.8;
          }
          if (!IMAGE_RE.test(dataUrl)) throw new Error('圖片轉碼失敗');
          return dataUrl;
        },
        fromClipboard(event) {
          const items = Array.from((event.clipboardData && event.clipboardData.items) || []);
          const item = items.find((it) => it.kind === 'file' && it.type.startsWith('image/'));
          return item ? item.getAsFile() : null;
        },
        // 5. 圖片格式驗證：只接受 data:image/(jpeg|png|webp|gif);base64,
        isValidDataUrl(s) { return typeof s === 'string' && s.length <= CONFIG.MAX_PACKET_CHARS && IMAGE_RE.test(s); },
      };

      // ===== UI =====
      const UI = {
        nickResolve: null,

        // ── 對話區 ──
        nearBottom() { const m = $('messages'); return m.scrollHeight - m.scrollTop - m.clientHeight < 120; },
        scrollToBottom() { const m = $('messages'); m.scrollTop = m.scrollHeight; $('newMsgPill').hidden = true; },
        clearMessages() { $('messages').textContent = ''; $('newMsgPill').hidden = true; },
        append(node, { forceScroll = false } = {}) {
          const box = $('messages');
          const stick = forceScroll || this.nearBottom();
          node.classList.add('bubble-in');
          box.appendChild(node);
          while (box.childElementCount > CONFIG.MAX_RENDERED) box.firstElementChild.remove();
          if (stick) {
            this.scrollToBottom();
            const img = node.querySelector('img');
            if (img) img.addEventListener('load', () => this.scrollToBottom(), { once: true });
          } else {
            $('newMsgPill').hidden = false;
          }
        },
        // 系統通知（置中膠囊標籤）；tone: info | success | warn | error
        system(text, tone = 'info') {
          this.append(el('div', 'sys-pill' + (tone === 'info' ? '' : ' ' + tone), text));
        },
        // kind: 'text' | 'image' | 'locked'
        messageRow(packet, { mine, kind, content }) {
          const row = el('div', 'msg-row ' + (mine ? 'mine' : 'other'));
          if (!mine) {
            const meta = el('div', 'msg-meta');
            meta.append(
              el('span', 'msg-name', packet.sender.displayName),
              el('span', 'msg-time', timeStr(packet.timestamp) + (packet.encrypted && kind !== 'locked' ? ' · 🔒' : '')),
            );
            row.appendChild(meta);
          }
          let bubble;
          if (kind === 'locked') {
            bubble = el('div', 'bubble locked', '🔒 [加密訊息] 請點擊上方鎖頭輸入正確的房間密碼以解鎖內容');
            bubble.title = '點擊輸入房間密碼';
            bubble.addEventListener('click', () => UI.openLock());
          } else if (kind === 'image') {
            bubble = el('div', 'bubble image');
            const img = new Image();
            img.alt = '圖片訊息（點擊放大）';
            img.decoding = 'async';
            img.src = content;   // 已通過 Data URL 格式驗證
            img.addEventListener('click', () => UI.viewImage(content));
            bubble.appendChild(img);
          } else {
            bubble = el('div', 'bubble', content);
          }
          row.appendChild(bubble);
          if (mine) row.appendChild(el('div', 'msg-foot', (packet.encrypted ? '🔒 ' : '') + timeStr(packet.timestamp)));
          return row;
        },

        // ── 頂部列狀態 ──
        setConn(state, attempt = 0, delay = 0) {
          let text = '';
          if (state === 'online') text = '已連線';
          else if (state === 'connecting') text = attempt ? `重新連線中（第 ${attempt} 次）…` : '連線中…';
          else if (state === 'offline') text = `已斷線，${Math.ceil(delay / 1000)} 秒後重試`;
          else if (state === 'error') text = '函式庫載入失敗';
          $('connDot').dataset.state = state;
          $('connText').textContent = text;
          $('connWrap').title = '連線狀態：' + text;
        },
        setBroker(host) { $('brokerText').textContent = host; },
        setRoom(room) {
          $('roomBadge').textContent = '#' + room;
          $('roomBadge').title = '#' + room;
          document.title = `#${room} · P2P Chat`;
        },
        setIdentity() {
          $('nickText').textContent = Identity.displayName;
          $('btnNick').title = '修改基礎暱稱（目前：' + Identity.displayName + '）';
          this.renderMembers();
        },
        setLock(on) {
          $('btnLock').dataset.locked = on ? 'true' : 'false';
          $('lockIcon').textContent = on ? '🔒' : '🔓';
          $('lockText').textContent = on ? '已加密' : '未加密';
          $('lockState').textContent = on ? '目前狀態：🔒 已啟用端到端加密' : '目前狀態：🔓 未加密（明文傳送）';
          $('btnUnlockClear').disabled = !on;
        },
        applyTheme(dark, save) {
          document.documentElement.classList.toggle('dark', dark);
          $('themeIcon').textContent = dark ? '☀️' : '🌙';
          if (save) { try { localStorage.setItem('chat_theme', dark ? 'dark' : 'light'); } catch { /* 忽略 */ } }
        },

        // ── 在線名單（自己排第一） ──
        renderMembers() {
          const list = $('memberList');
          list.textContent = '';
          const me = Identity.displayName ? [{ baseName: Identity.baseName, displayName: Identity.displayName, me: true }] : [];
          const others = [...Presence.peers.values()].sort((a, b) => a.displayName.localeCompare(b.displayName));
          for (const p of me.concat(others)) {
            const li = el('li', 'member');
            const avatar = el('span', 'avatar', (Array.from(p.baseName || p.displayName)[0] || '?').toUpperCase());
            avatar.style.backgroundColor = `hsl(${hueFrom(p.displayName)}, 62%, 50%)`;
            const name = el('span', 'member-name', p.displayName);
            name.title = p.displayName;
            li.append(avatar, name);
            if (p.me) li.appendChild(el('span', 'member-tag', '你'));
            list.appendChild(li);
          }
          const count = me.length + others.length;
          $('memberCount').textContent = count;
          $('memberCountBadge').textContent = count;
        },

        // ── Modal 與抽屜 ──
        openModal(id, focusId) {
          $(id).hidden = false;
          if (focusId) setTimeout(() => $(focusId).focus(), 30);
        },
        closeModal(id) {
          const modal = $(id);
          if (modal.hidden) return;
          modal.hidden = true;
          if (id === 'imgModal') $('imgModalImg').removeAttribute('src');
          if (id === 'nickModal' && this.nickResolve) { const done = this.nickResolve; this.nickResolve = null; done(null); }
        },
        topModal() { return ['imgModal', 'shareModal', 'lockModal', 'nickModal'].find((id) => !$(id).hidden) || null; },
        openDrawer() { $('sidebar').classList.remove('translate-x-full'); $('drawerOverlay').hidden = false; },
        closeDrawer() { $('sidebar').classList.add('translate-x-full'); $('drawerOverlay').hidden = true; },
        viewImage(src) { $('imgModalImg').src = src; this.openModal('imgModal'); },
        openLock() { $('lockInput').value = ''; this.openModal('lockModal', 'lockInput'); },
        fatal(title, message) { $('fatalTitle').textContent = title; $('fatalMsg').textContent = message; $('fatal').hidden = false; },

        // 暱稱 Modal：初次進入時不可關閉；回傳 Promise<string|null>
        askNickname(initial) {
          return new Promise((resolve) => {
            $('nickTitle').textContent = initial ? '歡迎！先取個暱稱' : '修改基礎暱稱';
            $('nickInput').value = initial ? '' : Identity.baseName;
            $('nickError').textContent = '';
            $('nickCancel').hidden = initial;
            $('nickModal').dataset.closable = initial ? 'false' : 'true';
            this.nickResolve = resolve;
            this.openModal('nickModal', 'nickInput');
          });
        },
        submitNick() {
          const raw = $('nickInput').value;
          const error = validateNick(raw);
          if (error) { $('nickError').textContent = error; $('nickInput').focus(); return; }
          const done = this.nickResolve;
          this.nickResolve = null;
          $('nickModal').hidden = true;
          if (done) done(raw.trim());
        },

        // ── 分享：網址 + QR Code ──
        openShare() {
          const url = location.href;
          $('shareUrl').value = url;
          const box = $('qrBox');
          box.textContent = '';
          let note = '用手機相機掃描即可進入同一個房間';
          if (!window.QRCode) {
            note = 'QR Code 元件載入失敗，請直接複製網址分享';
          } else {
            try {
              new QRCode(box, { text: url, width: 200, height: 200, colorDark: '#000000', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });
            } catch {
              box.textContent = '';
              note = '網址過長，無法產生 QR Code';
            }
          }
          if (location.protocol === 'file:') note += '（目前是本機檔案網址，其他裝置無法開啟）';
          $('qrWrap').hidden = box.childElementCount === 0;
          $('qrNote').textContent = note;
          this.openModal('shareModal', 'btnCopy');
        },
        async copyShare() {
          const input = $('shareUrl');
          try {
            await navigator.clipboard.writeText(input.value);
            toast('已複製到剪貼簿');
            return;
          } catch { /* 改用備援方式 */ }
          input.focus();
          input.select();
          let ok = false;
          try { ok = document.execCommand('copy'); } catch { /* 忽略 */ }
          toast(ok ? '已複製到剪貼簿' : '請手動複製網址', ok ? 'info' : 'error');
        },
      };

      // ===== Bootstrap =====
      // App：串接各模組的流程控制（送出、接收分派、房間切換、密碼、身分）
      const App = {
        inbox: Promise.resolve(),   // 依序處理收到的封包，避免非同步解密打亂順序
        locked: [],                 // 尚未能解密的訊息 { packet, row }
        unloading: false,
        introPending: true,
        rolling: false,

        makePacket(type) {
          return {
            id: newMsgId(), type, room: Router.room, sender: Identity.sender(),
            encrypted: false, iv: '', payload: '', timestamp: Date.now(),
          };
        },
        sendControl(type) { return Transport.publish(this.makePacket(type)); },
        // 有房間密碼就加密，否則以明文放入 payload
        async seal(packet, plain) {
          if (CryptoBox.key) Object.assign(packet, { encrypted: true }, await CryptoBox.encrypt(plain));
          else packet.payload = plain;
          return packet;
        },

        // ── 送出 ──
        async sendText() {
          const input = $('msgInput');
          const text = input.value.trim();
          if (!text) return;
          if (!Transport.subscribed) { toast('尚未連線，訊息未送出', 'error'); return; }
          input.value = '';
          autoGrow();
          try {
            const packet = await this.seal(this.makePacket('chat'), text);
            if (!Transport.publish(packet)) throw new Error('尚未連線，訊息未送出');
            Typing.resetLocal();
            UI.append(UI.messageRow(packet, { mine: true, kind: 'text', content: text }), { forceScroll: true });
          } catch (err) {
            if (!input.value) { input.value = text; autoGrow(); }
            toast(err.message || '訊息送出失敗', 'error');
          }
        },
        async sendImage(file) {
          if (!Transport.subscribed) { toast('尚未連線，無法傳送圖片', 'error'); return; }
          const btn = $('btnImage');
          btn.disabled = true;
          try {
            const dataUrl = await Media.compress(file);
            const packet = await this.seal(this.makePacket('image'), dataUrl);
            if (JSON.stringify(packet).length > CONFIG.MAX_PACKET_CHARS) throw new Error('圖片過大，無法傳送');
            if (!Transport.publish(packet)) throw new Error('尚未連線，無法傳送圖片');
            Typing.resetLocal();
            UI.append(UI.messageRow(packet, { mine: true, kind: 'image', content: dataUrl }), { forceScroll: true });
          } catch (err) {
            toast(err.message || '圖片傳送失敗', 'error');
          } finally {
            btn.disabled = false;
          }
        },

        // ── 接收 ──
        onRaw(payload) {
          let p;
          try {
            const text = payload instanceof Uint8Array ? new TextDecoder().decode(payload) : String(payload);
            if (text.length > CONFIG.MAX_PACKET_CHARS) return;
            p = JSON.parse(text);
          } catch { return; }
          if (!this.valid(p) || Transport.sentIds.has(p.id)) return;   // 格式不符或自己的回音
          this.inbox = this.inbox.then(() => this.dispatch(p)).catch((err) => console.warn('[dispatch]', err));
        },
        valid(p) {
          if (!p || typeof p !== 'object' || !TYPES.has(p.type) || p.room !== Router.room) return false;
          if (typeof p.id !== 'string' || p.id.length > 64) return false;
          const s = p.sender;
          if (!s || typeof s !== 'object') return false;
          if (typeof s.displayName !== 'string' || !s.displayName || s.displayName.length > 64) return false;
          if (typeof s.uid !== 'string' || s.uid.length > 16 || typeof s.baseName !== 'string' || s.baseName.length > 40) return false;
          p.encrypted = p.encrypted === true;
          p.iv = typeof p.iv === 'string' ? p.iv : '';
          p.payload = typeof p.payload === 'string' ? p.payload : '';
          if (!Number.isFinite(p.timestamp)) p.timestamp = Date.now();
          return true;
        },
        async dispatch(p) {
          const s = p.sender;
          const self = s.displayName === Identity.displayName;   // 同一身分開在其他分頁
          switch (p.type) {
            case 'join':
              if (self) return;
              if (Presence.touch(s)) UI.system(`${s.displayName} 加入了房間`, 'success');
              this.sendControl('heartbeat');   // 協助新成員快速建立在線名單
              return;
            case 'heartbeat':
              Presence.touch(s);
              return;
            case 'typing':
              if (self) return;
              Presence.touch(s);
              Typing.onRemote(s.displayName);
              return;
            case 'leave':
              if (self) return;
              Typing.clear(s.displayName);
              if (Presence.remove(s.displayName)) UI.system(`${s.displayName} 已離開房間`);
              return;
            default: {   // chat / image：同時視為一次心跳
              Presence.touch(s);
              Typing.clear(s.displayName);
              const row = await this.buildIncoming(p);
              if (row && p.room === Router.room) UI.append(row);
            }
          }
        },
        async buildIncoming(p) {
          let content = p.payload;
          if (p.encrypted) {
            try {
              content = await CryptoBox.decrypt(p.payload, p.iv);
            } catch {
              const row = UI.messageRow(p, { mine: false, kind: 'locked' });
              this.locked.push({ packet: p, row });
              if (this.locked.length > 200) this.locked.shift();
              return row;
            }
          }
          return this.rowFor(p, content);
        },
        rowFor(p, content) {
          if (p.type === 'image') {
            if (!Media.isValidDataUrl(content)) {
              UI.system(`已略過 ${p.sender.displayName} 傳來的格式不正確圖片`, 'warn');
              return null;
            }
            return UI.messageRow(p, { mine: false, kind: 'image', content });
          }
          if (!content.trim()) return null;
          const text = content.length > CONFIG.MAX_TEXT_LEN ? content.slice(0, CONFIG.MAX_TEXT_LEN) + '…' : content;
          return UI.messageRow(p, { mine: false, kind: 'text', content: text });
        },
        // 輸入正確密碼後，把先前鎖住的訊息就地解開
        async retryLocked() {
          const pending = this.locked;
          this.locked = [];
          let opened = 0;
          for (const item of pending) {
            if (!item.row.isConnected) continue;
            try {
              const content = await CryptoBox.decrypt(item.packet.payload, item.packet.iv);
              const row = this.rowFor(item.packet, content);
              if (row) { item.row.replaceWith(row); opened += 1; } else { item.row.remove(); }
            } catch {
              this.locked.push(item);
            }
          }
          return opened;
        },

        // ── 房間密碼 ──
        async applyPassword(password) {
          if (!password) { toast('請輸入房間密碼', 'error'); return; }
          const btn = $('btnLockApply');
          const room = Router.room;
          btn.disabled = true;
          btn.textContent = '金鑰衍生中…';
          try {
            const key = await CryptoBox.derive(password, room);
            if (room !== Router.room) return;   // 衍生期間已切換房間
            CryptoBox.key = key;
            UI.setLock(true);
            UI.closeModal('lockModal');
            UI.system('🔒 已啟用端到端加密：之後的文字與圖片只有輸入相同密碼的成員能解讀', 'success');
            const opened = await this.retryLocked();
            if (opened) toast(`已解鎖 ${opened} 則加密訊息`);
          } catch (err) {
            toast('金鑰衍生失敗：' + err.message, 'error');
          } finally {
            btn.disabled = false;
            btn.textContent = '套用';
            $('lockInput').value = '';
          }
        },
        clearPassword(silent = false) {
          const had = !!CryptoBox.key;
          CryptoBox.key = null;
          UI.setLock(false);
          UI.closeModal('lockModal');
          if (had && !silent) UI.system('🔓 已移除房間密碼，之後的訊息將以明文傳送', 'warn');
        },

        // ── 房間切換（URL Hash） ──
        onHashChange() {
          const room = Router.readHash();
          if (room !== Router.room) this.switchRoom(room);
        },
        switchRoom(room) {
          if (Transport.subscribed) this.sendControl('leave');
          Transport.unsubscribe();
          Presence.stopHeartbeat();
          Presence.reset();
          Typing.clearAll();
          this.locked = [];
          const hadKey = !!CryptoBox.key;
          this.clearPassword(true);   // 金鑰以房間名稱為 Salt，換房間必須重設
          Router.room = room;
          UI.setRoom(room);
          UI.clearMessages();
          if (hadKey) UI.system('已切換房間，房間密碼已重設', 'warn');
          this.introPending = true;
          if (Transport.connected) Transport.subscribe(room);
          else if (Transport.client) UI.system(`目前離線，連線恢復後會自動加入 #${room}`, 'warn');
        },
        onSubscribed(isReconnect) {
          Presence.refreshAll();
          this.sendControl('join');
          Presence.startHeartbeat();
          if (this.introPending) {
            this.introPending = false;
            UI.system(`你已進入 #${Router.room}，身分：${Identity.displayName}`);
          } else if (isReconnect) {
            UI.system('已重新連線', 'success');
          }
        },
        onDisconnected() { UI.system('連線中斷，正在嘗試重新連線…', 'error'); },

        // ── 身分 ──
        async editNickname() {
          const name = await UI.askNickname(false);
          if (name && name !== Identity.baseName) await this.changeIdentity(name, false);
        },
        // 先以舊身分送 leave，再以新身分送 join
        async changeIdentity(name, rollover) {
          const online = Transport.subscribed;
          const before = Identity.displayName;
          if (online) this.sendControl('leave');
          if (rollover) await Identity.apply(name); else await Identity.save(name);
          UI.setIdentity();
          if (online) this.sendControl('join');
          UI.system(rollover ? `日期已更新，新身分：${Identity.displayName}` : `暱稱已更新：${before} → ${Identity.displayName}`, 'success');
        },
        // 跨日時自動換成新日期的身分
        checkDayRollover() {
          if (this.rolling || !Identity.date || Identity.date === todayStr()) return;
          this.rolling = true;
          this.changeIdentity(Identity.baseName, true).finally(() => { this.rolling = false; });
        },
        leaveOnUnload() {
          if (this.unloading) return;
          this.unloading = true;
          if (Transport.subscribed) this.sendControl('leave');
        },
      };

      // 事件一律以 addEventListener 綁定（HTML 中不使用 onclick 等行內屬性）
      function bindEvents() {
        const input = $('msgInput');
        $('composer').addEventListener('submit', (e) => { e.preventDefault(); App.sendText(); });
        input.addEventListener('keydown', (e) => {
          // Enter 送出、Shift+Enter 換行；中文輸入法選字中（isComposing）不送出
          if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229) {
            e.preventDefault();
            App.sendText();
          }
        });
        input.addEventListener('input', () => { autoGrow(); Typing.onLocalInput(); });
        input.addEventListener('paste', (e) => {   // Ctrl + V 貼上剪貼簿截圖
          const file = Media.fromClipboard(e);
          if (file) { e.preventDefault(); App.sendImage(file); }
        });
        $('btnImage').addEventListener('click', () => $('fileInput').click());
        $('fileInput').addEventListener('change', (e) => {
          const file = e.target.files && e.target.files[0];
          e.target.value = '';
          if (file) App.sendImage(file);
        });

        $('btnLock').addEventListener('click', () => UI.openLock());
        $('lockForm').addEventListener('submit', (e) => { e.preventDefault(); App.applyPassword($('lockInput').value); });
        $('btnUnlockClear').addEventListener('click', () => App.clearPassword());
        $('btnShare').addEventListener('click', () => UI.openShare());
        $('btnCopy').addEventListener('click', () => UI.copyShare());
        $('btnTheme').addEventListener('click', () => UI.applyTheme(!document.documentElement.classList.contains('dark'), true));
        $('btnNick').addEventListener('click', () => App.editNickname());
        $('nickForm').addEventListener('submit', (e) => { e.preventDefault(); UI.submitNick(); });
        $('nickCancel').addEventListener('click', () => UI.closeModal('nickModal'));

        $('btnMembers').addEventListener('click', () => UI.openDrawer());
        $('btnCloseDrawer').addEventListener('click', () => UI.closeDrawer());
        $('drawerOverlay').addEventListener('click', () => UI.closeDrawer());
        $('roomForm').addEventListener('submit', (e) => {
          e.preventDefault();
          const raw = $('roomInput').value.trim();
          if (!raw) { toast('請輸入房間名稱', 'error'); return; }
          if (Router.normalize(raw) === Router.room) { toast('你已經在這個房間了'); return; }
          $('roomInput').value = '';
          UI.closeDrawer();
          Router.go(raw);
        });
        $('btnRandomRoom').addEventListener('click', () => { UI.closeDrawer(); Router.go(Router.randomRoom()); });

        $('newMsgPill').addEventListener('click', () => UI.scrollToBottom());
        $('messages').addEventListener('scroll', () => { if (UI.nearBottom()) $('newMsgPill').hidden = true; });

        // Modal：點背景或 ✕ 關閉；圖片檢視點任意處關閉；初次設定暱稱時不可關閉
        document.querySelectorAll('[data-modal]').forEach((modal) => {
          modal.addEventListener('click', (e) => {
            if (modal.dataset.closable === 'false') return;
            if (e.target === modal || e.target.closest('[data-close]') || modal.id === 'imgModal') UI.closeModal(modal.id);
          });
        });
        document.addEventListener('keydown', (e) => {
          if (e.key !== 'Escape') return;
          const top = UI.topModal();
          if (top) { if ($(top).dataset.closable !== 'false') UI.closeModal(top); }
          else if (!$('drawerOverlay').hidden) UI.closeDrawer();
        });

        window.addEventListener('hashchange', () => App.onHashChange());
        window.addEventListener('beforeunload', () => App.leaveOnUnload());
        window.addEventListener('pagehide', () => App.leaveOnUnload());
        window.addEventListener('pageshow', (e) => {
          if (!e.persisted) return;   // 從返回快取恢復：重新宣告在線
          App.unloading = false;
          if (Transport.subscribed) App.sendControl('join'); else Transport.retryNow();
        });
        window.addEventListener('online', () => Transport.retryNow());
        document.addEventListener('visibilitychange', () => {
          if (!document.hidden && Transport.subscribed) App.sendControl('heartbeat');
        });
      }

      // 啟動流程：環境檢查 → 身分初始化 → 路由解析 → 建立連線
      async function bootstrap() {
        bindEvents();
        UI.applyTheme(document.documentElement.classList.contains('dark'), false);
        UI.setLock(false);

        // 6.5 環境檢查：Web Crypto 只在安全環境（HTTPS / localhost / file://）提供
        if (!window.isSecureContext || !window.crypto || !crypto.subtle) {
          UI.fatal('無法在目前的環境執行', '本聊天室需要瀏覽器的 Web Crypto 功能，只能在安全環境（HTTPS、localhost 或直接開啟本機檔案）下運作。請改用 HTTPS 網址開啟本頁。');
          return;
        }

        Router.room = Router.readHash();
        UI.setRoom(Router.room);

        let ready = false;
        try { ready = await Identity.load(); } catch (err) { console.warn('[Identity]', err); }
        if (!ready) await Identity.save(await UI.askNickname(true));
        UI.setIdentity();
        if (Identity.storage === 'localStorage') UI.system('此環境無法使用 Cookie，身分已改存於 localStorage', 'warn');
        if (Identity.storage === 'memory') UI.system('此環境無法保存身分，重新整理後需重新輸入暱稱', 'warn');

        // 6.3 相依函式庫檢查（QRCode 缺少時只停用分享視窗的 QR Code）
        if (!window.mqtt) {
          UI.setConn('error');
          UI.system('相依函式庫載入失敗，請檢查網路後重新整理', 'error');
          return;
        }

        setInterval(() => {
          Presence.sweep();
          Transport.pruneSent();
          App.checkDayRollover();
        }, CONFIG.SWEEP_MS);
        Transport.connect();
      }

      bootstrap();
    })();
  </script>
</body>
</html>
